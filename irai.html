.phone-button{

  text-decoration:none;

.card{

}

h2{
  font-size:1.55rem;

  margin-bottom:12px;
}

  margin-bottom:22px;
}

input,

  border-radius:8px;

.note{

  background:#f0f7f3;

.submit{

  margin-top:25px;
  padding:16px 12px;
  border:0;
  border-radius:10px;
  background:#e60012;
  color:#fff;
  font-size:1.15rem;
  font-weight:bold;

.submit:active{

.back{

  text-align:center;

  color:#006633;

<form
action="https://formsubmit.co/y268204130@gmail.com"

enctype="multipart/form-data"
>

<!-- メール設定 -->

<input
type="hidden"
name="_subject"
value="【ナカショー】仕事依頼"
>

<input
type="hidden"
name="_template"
value="table"
>

<input
type="hidden"
name="_captcha"

<input
type="hidden"
name="_next"
value="https://yoshiki345.github.io/nakasho/"
>


<!-- お名前 -->

<label>
お名前<span class="required">必須</span>
</label>

type="text"
name="お名前"
placeholder="例：山田太郎"
required
>


<!-- 電話番号 -->

<label>
電話番号<span class="required">必須</span>
</label>

<input
type="tel"
name="電話番号"
placeholder="例：090-1234-5678"
required
>


<!-- メールアドレス -->

<label>
メールアドレス<span class="required">必須</span>
</label>

<input
type="email"
name="_replyto"
placeholder="例：example@gmail.com"
required
>

<div class="note">
※こちらのメールアドレスに、ナカショーから返信します。
</div>


<!-- 依頼内容 -->

依頼内容<span class="required">必須</span>

<option>

<option>

<option>

<option>

</option>

<option>
空き家管理
</option>

<option>
瓦屋根の点検・補修
</option>

<option>
雨漏り対応
</option>

<option>
雪かき
</option>

<option>
その他
</option>

<!-- 詳細 -->

<label>
詳しい内容<span class="required">必須</span>
</label>

<textarea
name="詳しい内容"
placeholder="例：タンス2台を処分したいです。2階にあります。"
required
></textarea>

<label>
写真を添付
</label>

<input
type="file"
name="写真"
accept="image/jpeg,image/png"

>

<div class="note">
現場の写真があると、見積もりがしやすくなります。<br>
写真は合計10MB以内にしてください。
