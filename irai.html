<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仕事依頼｜ナカショー｜富山市・射水市・高岡市</title>
<meta name="description" content="富山市・射水市・高岡市の便利屋ナカショー。仕事依頼はこちら。見積もり無料。">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#f3f7f3;color:#222;line-height:1.7}
header{background:#075e35;color:white;text-align:center;padding:22px 12px}
h1{margin:0;font-size:27px}
main{max-width:700px;margin:20px auto;padding:0 12px}
section{background:white;padding:20px 16px;border-radius:12px}
h2{color:#075e35}
label{display:block;font-weight:bold;margin-top:16px}
input,select,textarea{width:100%;padding:13px;font-size:16px;border:1px solid #aaa;border-radius:7px}
textarea{min-height:100px}
button,.tel{display:block;width:100%;padding:15px;margin-top:22px;background:#d60000;color:white;text-align:center;font-size:18px;font-weight:bold;border:0;border-radius:8px;text-decoration:none}
.note{background:#fff4d6;padding:12px;border-radius:7px}
.back{display:block;text-align:center;margin:24px;color:#075e35}
footer{text-align:center;background:#064927;color:white;padding:18px}
</style>
</head>
<body>
<header>
<h1>ナカショー</h1>
<p>富山市・射水市・高岡市対応の便利屋</p>
<a class="tel" href="tel:08062466963">電話する 080-6246-6963</a>
</header>
<main>
<section>
<h2>仕事を依頼する</h2>
<p>必要事項を入力してください。内容を確認してご連絡します。</p>
<p class="note">見積もり無料！ ご依頼内容に応じて対応可能か確認いたします。</p>

<form action="https://formsubmit.co/y26820413@gmail.com" method="POST">
<input type="hidden" name="_subject" value="【ナカショー】新しい仕事依頼">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<label>依頼したいサービス *</label>
<select name="依頼サービス" required>
<option value="">選択してください</option>
<option>不用品回収</option>
<option>片付け・整理</option>
<option>家具移動・運搬</option>
<option>草むしり・草刈り</option>
<option>庭仕事</option>
<option>瓦屋根の点検</option>
<option>瓦屋根の補修</option>
<option>雨漏りの応急対応</option>
<option>空き家管理</option>
<option>雪かき</option>
<option>物置・犬小屋の撤去</option>
<option>プチ解体</option>
<option>買い物のお手伝い</option>
<option>その他</option>
</select>

<label>依頼内容・詳しい状況 *</label>
<textarea name="依頼内容" required placeholder="例：タンスの処分、庭の草むしり"></textarea>

<label>作業場所・住所 *</label>
<input name="作業場所" required placeholder="例：富山市○○町">

<label>希望日</label>
<input type="date" name="希望日">

<label>お名前 *</label>
<input name="お名前" required autocomplete="name" placeholder="お名前">

<label>電話番号 *</label>
<input type="tel" name="電話番号" required autocomplete="tel" placeholder="080-0000-0000">

<label>返信用メールアドレス（任意）</label>
<input type="email" name="返信用メールアドレス" placeholder="メールで返信希望の場合">

<label>その他・連絡事項</label>
<textarea name="その他の連絡事項"></textarea>

<button type="submit">仕事依頼を送信する</button>
</form>

<a class="back" href="index.html">← トップページに戻る</a>
</section>
</main>
<footer>
<p>ナカショー｜便利屋</p>
<p>対応エリア：富山市・射水市・高岡市</p>
<p>営業時間：9:00〜17:00</p>
</footer>
</body>
</html>
