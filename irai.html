<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>仕事を依頼する｜ナカショー</title>

<meta name="description" content="ナカショーへの仕事依頼フォーム。不用品回収、片付け、草刈り、運搬、屋根修理、空き家管理などを依頼できます。">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;
  background:#f5f7fa;
  color:#172033;
  line-height:1.7;
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:0 16px;
}

header{
  background:#111827;
  color:white;
  padding:24px 0;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:5px 0 0;
}

.tel{
  display:inline-block;
  margin-top:12px;
  color:white;
  background:#dc2626;
  padding:10px 16px;
  border-radius:10px;
  text-decoration:none;
  font-weight:900;
}

section{
  padding:25px 0;
}

.box{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 2px 12px #00000012;
}

label{
  display:block;
  font-weight:900;
  margin:18px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
  font-family:inherit;
  background:white;
}

textarea{
  resize:vertical;
}

.required{
  color:#dc2626;
}

.notice{
  background:#fff7ed;
  border-left:5px solid #f97316;
  padding:14px;
  border-radius:8px;
  margin-bottom:20px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:16px;
  background:#111827;
  color:white;
  font-size:18px;
  font-weight:900;
  margin-top:22px;
}

.result{
  display:none;
}

.result pre{
  white-space:pre-wrap;
  background:#f1f5f9;
  padding:16px;
  border-radius:10px;
  font-family:inherit;
}

.share{
  background:#075c3a;
}

.phone{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:15px;
  background:#dc2626;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-weight:900;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#111827;
  font-weight:800;
}

.small{
  font-size:13px;
  color:#64748b;
}

footer{
  background:#111827;
  color:white;
  padding:30px 0;
  margin-top:20px;
}

@media(max-width:600px){
  header h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
<div class="wrap">

<h1>🛠️ ナカショー 仕事依頼</h1>

<p>
富山市・射水市・高岡市を中心に富山県全域
</p>

<a class="tel" href="tel:08062466963">
☎ 080-6246-6963
</a>

</div>
</header>

<section>

<div class="wrap">

<div class="box">

<h2>仕事を依頼する</h2>

<div class="notice">
「こんなこと頼める？」でも大丈夫です。<br>
できる限り対応しますので、まずはご相談ください。
</div>

<form id="requestForm">

<label>
作業内容 <span class="required">*</span>
</label>

<select id="service" required>

<option value="">選択してください</option>

<option>不用品回収</option>
<option>片付け・整理</option>
<option>草刈り・草むしり</option>
<option>庭仕事</option>
<option>運搬・家具移動</option>
<option>屋根修理・瓦補修</option>
<option>空き家管理</option>
<option>雪かき・雪下ろし</option>
<option>物置・犬小屋の撤去</option>
<option>プチ解体</option>
<option>買い物のお手伝い</option>
<option>その他</option>

</select>

<label>
詳しい内容
</label>

<textarea
id="detail"
rows="6"
placeholder="何をしてほしいか、できるだけ詳しく書いてください">
</textarea>

<label>
現場の住所・地域 <span class="required">*</span>
</label>

<input
id="address"
type="text"
placeholder="富山市○○町など"
required>

<label>
希望日
</label>

<input
id="date"
type="date">

<label>
希望時間
</label>

<select id="time">

<option>指定なし</option>
<option>午前</option>
<option>午後</option>
<option>時間指定あり</option>

</select>

<label>
お名前 <span class="required">*</span>
</label>

<input
id="name"
type="text"
required>

<label>
電話番号 <span class="required">*</span>
</label>

<input
id="phone"
type="tel"
inputmode="tel"
placeholder="080-0000-0000"
required>

<label>
写真
</label>

<input
id="photos"
type="file"
accept="image/*"
multiple>

<p class="small">
現場の写真があると、作業内容を確認しやすくなります。
</p>

<label>
その他・連絡事項
</label>

<textarea
id="note"
rows="4">
</textarea>

<button type="submit">
依頼内容を確認する
</button>

</form>

</div>

</div>

</section>


<section
id="result"
class="result">

<div class="wrap">

<div class="box">

<h2>依頼内容の確認</h2>

<pre id="resultText"></pre>

<button
class="share"
id="shareButton"
type="button">
📤 この依頼内容を送る
</button>

<a
class="phone"
href="tel:08062466963">
☎ 電話で依頼する
</a>

<a
class="back"
href="index.html">
← トップページに戻る
</a>

<p class="small">
「この依頼内容を送る」を押すと、iPhoneの共有画面からメールなどで送れます。
</p>

</div>

</div>

</section>


<footer>

<div class="wrap">

ナカショー<br>
便利屋・不用品回収・片付け・草刈り・運搬など<br>
電話：080-6246-6963

</div>

</footer>


<script>

const form =
document.getElementById("requestForm");

const result =
document.getElementById("result");

const resultText =
document.getElementById("resultText");

const shareButton =
document.getElementById("shareButton");


form.addEventListener("submit", function(e){

e.preventDefault();

const service =
document.getElementById("service").value;

const detail =
document.getElementById("detail").value;

const address =
document.getElementById("address").value;

const date =
document.getElementById("date").value || "指定なし";

const time =
document.getElementById("time").value;

const name =
document.getElementById("name").value;

const phone =
document.getElementById("phone").value;

const photos =
document.getElementById("photos").files;

const note =
document.getElementById("note").value;

let photoNames = "なし";

if(photos.length > 0){

photoNames =
Array.from(photos)
.map(file => file.name)
.join(", ");

}

const text =

"【ナカショー 仕事依頼】\n\n" +

"作業内容：" + service + "\n" +

"詳しい内容：" + (detail || "なし") + "\n" +

"現場住所：" + address + "\n" +

"希望日：" + date + "\n" +

"希望時間：" + time + "\n" +

"お名前：" + name + "\n" +

"電話番号：" + phone + "\n" +

"写真：" + photoNames + "\n" +

"その他：" + (note || "なし");

resultText.textContent = text;

form.parentElement.parentElement.style.display =
"none";

result.style.display =
"block";

window.scrollTo(0,0);


shareButton.onclick = async function(){

if(navigator.share){

try{

await navigator.share({

title:"ナカショー仕事依頼",

text:text

});

}catch(error){}

}else{

try{

await navigator.clipboard.writeText(text);

alert("依頼内容をコピーしました。");

}catch(error){

alert("依頼内容をコピーできませんでした。");

}

}

};

});

</script>

</body>
</html>
